<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#EDF4EC">
<title>Kalkulator Kalorii</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDF4EC;
    --surface: #FFFFFF;
    --text: #0B0D14;
    --muted: #46584B;
    --subtle: #8AA08F;
    --accent: #2EAA5C;
    --accent-soft: #E2F2E6;
    --accent-fg: #0B0D14;
    --chip: #E2EEE1;
    --hair: #E6F0E5;
    --cta: #6CE992;
    --cta-fg: #0B0D14;
    --cta-shadow: rgba(63,203,120,0.45);
    --rm-bg: #F6E4DE;
    --rm-fg: #993049;
    --shadow: 0 6px 20px rgba(36,72,48,0.08);
    --shadow-xs: 0 1px 3px rgba(36,72,48,0.06);
    --shadow-focus: 0 0 0 4px rgba(46,170,92,0.16);
    --mc-protein: #4A60F5;
    --mc-carbs: #3FCB78;
    --mc-fat: #E8B06A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    letter-spacing: 0.005em;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }
  .view {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .hidden { display: none !important; }

  /* ===== TOPBAR ===== */
  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 22px 14px;
    padding-top: max(18px, calc(env(safe-area-inset-top) + 8px));
  }
  .iconbtn {
    width: 40px;
    height: 40px;
    border-radius: 999px;
    background: var(--chip);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    flex: 0 0 auto;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .iconbtn:active { background: #d4e3d3; transform: scale(0.94); }
  .tb-title { display: flex; flex-direction: column; line-height: 1.1; }
  .tb-title .t { font-size: 21px; font-weight: 600; letter-spacing: -0.02em; }
  .tb-title .s { font-size: 13px; font-weight: 500; color: var(--subtle); margin-top: 3px; }

  /* ===== CALENDAR ===== */
  .cal-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 8px 26px 18px;
  }
  .cal-head .month {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.02em;
    text-transform: capitalize;
    line-height: 1;
  }
  .cal-head .year {
    font-size: 15px;
    font-weight: 500;
    color: var(--subtle);
    margin-left: 8px;
  }
  .cal-nav { display: flex; gap: 8px; }
  .cal-nav button {
    width: 38px;
    height: 38px;
    border-radius: 999px;
    border: none;
    background: var(--chip);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .cal-nav button:active { background: #d4e3d3; }
  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 0 18px;
    gap: 2px;
  }
  .cal-weekdays div {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--subtle);
    letter-spacing: 0.06em;
    padding-bottom: 8px;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    padding: 0 18px;
  }
  .cal-cell {
    aspect-ratio: 1;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: transparent;
    border: none;
    font-family: inherit;
    cursor: pointer;
    color: var(--text);
    transition: transform 0.1s;
  }
  .cal-cell:active { transform: scale(0.92); }
  .cal-cell .d { font-size: 15px; font-weight: 500; }
  .cal-cell .k { font-size: 9.5px; font-weight: 600; letter-spacing: 0.02em; }
  .cal-cell.other { opacity: 0.32; }
  .cal-cell.data { background: var(--accent-soft); }
  .cal-cell.data .k { color: var(--accent); }
  .cal-cell.today { background: var(--accent); }
  .cal-cell.today .d { color: var(--accent-fg); font-weight: 700; }
  .cal-cell.today .k { color: var(--accent-fg); opacity: 0.85; }
  .cal-foot {
    margin: 22px 18px 24px;
  }
  .cal-summary {
    background: var(--surface);
    border-radius: 18px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow);
  }
  .cal-summary .lbl {
    font-size: 12px;
    font-weight: 600;
    color: var(--subtle);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .cal-summary .val {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-top: 3px;
  }
  .cal-summary .val small {
    font-size: 13px;
    font-weight: 500;
    color: var(--subtle);
  }
  .cal-dot { width: 10px; height: 10px; border-radius: 3px; }

  /* ===== DAY ===== */
  .day-body {
    padding: 0 18px 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .hero {
    background: var(--surface);
    border-radius: 22px;
    padding: 22px 22px 20px;
    box-shadow: var(--shadow);
  }
  .hero .kcal-big {
    font-size: 52px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .hero .kcal-lbl {
    font-size: 13px;
    font-weight: 600;
    color: var(--subtle);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .macrobar {
    display: flex;
    height: 8px;
    border-radius: 999px;
    overflow: hidden;
    margin-top: 18px;
    gap: 3px;
    background: var(--hair);
  }
  .macrobar span {
    display: block;
    height: 100%;
    border-radius: 999px;
  }
  .macrolegend {
    display: flex;
    gap: 16px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .macrolegend .ml {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--muted);
  }
  .macrolegend .ml b { font-weight: 600; color: var(--text); }
  .macrolegend .dot { width: 9px; height: 9px; border-radius: 3px; }

  .macros {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .macro {
    background: var(--surface);
    border-radius: 16px;
    padding: 13px 6px;
    text-align: center;
    box-shadow: var(--shadow-xs);
  }
  .macro .mv {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .macro .mv small {
    font-size: 11px;
    font-weight: 500;
    color: var(--subtle);
  }
  .macro .mn {
    font-size: 10px;
    font-weight: 600;
    color: var(--subtle);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-top: 3px;
  }

  /* ===== SEARCH (inline) ===== */
  .search-wrap { padding: 4px 0 0; }
  .search-field {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1.5px solid var(--hair);
    border-radius: 14px;
    padding: 13px 16px;
    box-shadow: var(--shadow-xs);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search-field:focus-within {
    border-color: var(--accent);
    box-shadow: var(--shadow-focus);
  }
  .search-field svg { color: var(--subtle); flex: 0 0 auto; }
  .search-field:focus-within svg { color: var(--accent); }
  .search-field input {
    flex: 1 1 auto;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    min-width: 0;
  }
  .search-field input::placeholder { color: var(--subtle); }
  .search-clear {
    background: var(--chip);
    border: none;
    color: var(--muted);
    width: 22px;
    height: 22px;
    border-radius: 999px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .search-clear.show { display: flex; }
  .search-hint {
    font-size: 11px;
    font-weight: 600;
    color: var(--subtle);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 4px 0;
    display: none;
  }
  .search-hint.show { display: block; }
  .results {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-top: 4px;
  }
  .prod-card {
    background: var(--surface);
    border-radius: 14px;
    padding: 13px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-xs);
    cursor: pointer;
    transition: transform 0.1s;
  }
  .prod-card:active { transform: scale(0.98); }
  .pc-info { flex: 1 1 auto; min-width: 0; }
  .pc-name {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pc-meta {
    font-size: 12px;
    color: var(--subtle);
    margin-top: 2px;
  }
  .pc-add {
    width: 34px;
    height: 34px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }

  /* ===== MEALS ===== */
  .meals-wrap {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .meal-group { }
  .meal-picker {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .meal-picker button {
    border: none;
    background: var(--chip);
    color: var(--muted);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 9px 6px;
    border-radius: 12px;
    cursor: pointer;
  }
  .meal-picker button.on {
    background: var(--accent);
    color: white;
  }
  /* ===== MEAL LIST ===== */
  .meal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 4px 8px;
    margin-top: 4px;
  }
  .meal-head .mh-l {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .meal-head .mh-dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--accent);
  }
  .meal-head .mh-name {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .meal-head .mh-kcal {
    font-size: 13px;
    font-weight: 600;
    color: var(--subtle);
  }
  .meal-head .mh-clear {
    background: none;
    border: none;
    font-family: inherit;
    color: var(--rm-fg);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 4px 6px;
  }
  .meal-card {
    background: var(--surface);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .meal-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--hair);
  }
  .meal-item:last-child { border-bottom: none; }
  .mi-info { flex: 1 1 auto; min-width: 0; }
  .mi-name {
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mi-meta {
    font-size: 12px;
    color: var(--subtle);
    margin-top: 1px;
  }
  .mi-kcal {
    font-size: 14px;
    font-weight: 600;
    flex: 0 0 auto;
  }
  .mi-rm {
    width: 26px;
    height: 26px;
    border-radius: 999px;
    background: var(--rm-bg);
    color: var(--rm-fg);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    border: none;
    cursor: pointer;
  }
  .empty-meal {
    padding: 18px 16px;
    font-size: 13px;
    color: var(--subtle);
    text-align: center;
  }
  .loader {
    text-align: center;
    padding: 22px;
    color: var(--subtle);
    font-size: 13px;
  }
  .spinner {
    width: 24px;
    height: 24px;
    border: 2.5px solid var(--hair);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== MODAL SHEET ===== */
  .sheet-dim {
    position: fixed;
    inset: 0;
    background: rgba(11, 13, 20, 0.42);
    backdrop-filter: blur(2px);
    display: none;
    z-index: 90;
  }
  .sheet-dim.show { display: block; animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet {
    position: fixed;
    left: 50%;
    transform: translateX(-50%) translateY(100%);
    bottom: 0;
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border-radius: 26px 26px 0 0;
    padding: 22px 22px 26px;
    padding-bottom: calc(26px + env(safe-area-inset-bottom));
    box-shadow: 0 -10px 40px rgba(11, 13, 20, 0.18);
    z-index: 100;
    transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .sheet.show { transform: translateX(-50%) translateY(0); }
  .grab {
    width: 38px;
    height: 4px;
    border-radius: 999px;
    background: var(--hair);
    margin: -6px auto 14px;
  }
  .s-title {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-align: center;
  }
  .s-sub {
    font-size: 12px;
    font-weight: 500;
    color: var(--subtle);
    text-align: center;
    margin-top: 3px;
    margin-bottom: 18px;
  }
  .field-lbl {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .grams {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
    background: var(--bg);
    border-radius: 14px;
    padding: 14px;
    border: 1.5px solid var(--accent);
  }
  .grams input {
    background: transparent;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    text-align: center;
    width: 110px;
    color: var(--text);
    -webkit-appearance: none;
    appearance: none;
    -moz-appearance: textfield;
  }
  .grams input::-webkit-outer-spin-button,
  .grams input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .grams .unit {
    font-size: 15px;
    font-weight: 500;
    color: var(--subtle);
  }
  .quick {
    display: flex;
    gap: 7px;
    justify-content: center;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .quick button {
    border: none;
    background: var(--chip);
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .quick button.on {
    background: var(--accent);
    color: var(--accent-fg);
    color: white;
  }
  .preview {
    background: var(--bg);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    margin: 18px 0;
  }
  .preview .pk {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .preview .pk small {
    font-size: 15px;
    font-weight: 600;
    color: var(--subtle);
  }
  .preview .pm {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-top: 6px;
  }
  .sheet-actions { display: flex; gap: 10px; }
  .sheet-actions button {
    flex: 1 1 0;
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 15px;
    border-radius: 14px;
    cursor: pointer;
  }
  .sheet-actions .cancel { background: var(--chip); color: var(--muted); }
  .sheet-actions .confirm {
    background: var(--cta);
    color: var(--cta-fg);
    box-shadow: 0 10px 24px var(--cta-shadow);
  }
</style>
</head>
<body>
<div id="app">

  <!-- WIDOK 1: KALENDARZ -->
  <div id="viewCalendar" class="view">
    <div class="cal-head" style="padding-top: max(28px, calc(env(safe-area-inset-top) + 18px));">
      <div style="display:flex; align-items:baseline;">
        <span class="month" id="calMonth"></span>
        <span class="year" id="calYear"></span>
      </div>
      <div class="cal-nav">
        <button id="prevMonth" aria-label="Poprzedni miesiąc">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button id="nextMonth" aria-label="Następny miesiąc">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>
    <div class="cal-weekdays">
      <div>Pn</div><div>Wt</div><div>Śr</div><div>Cz</div><div>Pt</div><div>Sb</div><div>Nd</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-foot">
      <div class="cal-summary">
        <div>
          <div class="lbl" id="avgLabel">Średnia w miesiącu</div>
          <div class="val"><span id="avgVal">0</span> <small>kcal / dzień</small></div>
        </div>
        <div style="display:flex; gap:5px;">
          <span class="cal-dot" style="background: var(--accent);"></span>
          <span class="cal-dot" style="background: var(--accent-soft);"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- WIDOK 2: DZIEŃ -->
  <div id="viewDay" class="view hidden">
    <div class="topbar">
      <button class="iconbtn" id="backToCal" aria-label="Wróć">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="tb-title">
        <span class="t" id="dayTitle">Dzisiaj</span>
        <span class="s" id="daySub"></span>
      </div>
    </div>

    <div class="day-body">
      <!-- HERO -->
      <div class="hero">
        <div class="kcal-big" id="totalCal">0</div>
        <div class="kcal-lbl">kcal spożyte dziś</div>
        <div class="macrobar">
          <span id="barP" style="background: var(--mc-protein); width:0%;"></span>
          <span id="barC" style="background: var(--mc-carbs); width:0%;"></span>
          <span id="barF" style="background: var(--mc-fat); width:0%;"></span>
        </div>
        <div class="macrolegend">
          <span class="ml"><span class="dot" style="background: var(--mc-protein);"></span> Białko <b id="legP">0 g</b></span>
          <span class="ml"><span class="dot" style="background: var(--mc-carbs);"></span> Węgle <b id="legC">0 g</b></span>
          <span class="ml"><span class="dot" style="background: var(--mc-fat);"></span> Tłuszcze <b id="legF">0 g</b></span>
        </div>
      </div>

      <!-- MAKRO TILES -->
      <div class="macros">
        <div class="macro">
          <div class="mv"><span id="mP">0</span><small> g</small></div>
          <div class="mn">Białko</div>
        </div>
        <div class="macro">
          <div class="mv"><span id="mC">0</span><small> g</small></div>
          <div class="mn">Węgle</div>
        </div>
        <div class="macro">
          <div class="mv"><span id="mF">0</span><small> g</small></div>
          <div class="mn">Tłuszcze</div>
        </div>
        <div class="macro">
          <div class="mv"><span id="mFi">0</span><small> g</small></div>
          <div class="mn">Błonnik</div>
        </div>
      </div>

      <!-- WYSZUKIWARKA INLINE -->
      <div class="search-wrap">
        <div class="search-field">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-3.6-3.6"/></svg>
          <input type="text" id="searchInput" placeholder="Szukaj produktu..." autocomplete="off">
          <button class="search-clear" id="searchClear" aria-label="Wyczyść">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="search-hint" id="searchHint">Podpowiedzi</div>
        <div class="results" id="results"></div>
      </div>

      <!-- LISTA POSIŁKÓW (4 sekcje) -->
      <div class="meals-wrap" id="mealsWrap"></div>
      <div style="display:flex; justify-content:flex-end; margin-top:4px;">
        <button class="mh-clear" id="clearDayBtn">Wyczyść cały dzień</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL SHEET -->
<div class="sheet-dim" id="sheetDim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="s-title" id="sheetTitle">Produkt</div>
  <div class="s-sub" id="sheetSub">0 kcal / 100 g</div>
  <div class="field-lbl">Posiłek</div>
  <div class="meal-picker" id="mealPicker">
    <button data-meal="sniadanie">Śniadanie</button>
    <button data-meal="obiad">Obiad</button>
    <button data-meal="kolacja">Kolacja</button>
    <button data-meal="inne">Inne</button>
  </div>
  <div class="field-lbl" style="margin-top:16px;">Ilość</div>
  <div class="grams">
    <input type="number" id="gramsInput" value="100" min="1" inputmode="numeric">
    <span class="unit">g</span>
  </div>
  <div class="quick" id="quickAmts">
    <button data-amt="30">30</button>
    <button data-amt="50">50</button>
    <button data-amt="100" class="on">100</button>
    <button data-amt="150">150</button>
    <button data-amt="200">200</button>
    <button data-amt="250">250</button>
  </div>
  <div class="preview">
    <div class="pk"><span id="prevKcal">0</span><small> kcal</small></div>
    <div class="pm" id="prevMacros">Białko 0 g · Węgle 0 g · Tłuszcze 0 g</div>
  </div>
  <div class="sheet-actions">
    <button class="cancel" id="cancelBtn">Anuluj</button>
    <button class="confirm" id="confirmBtn">Dodaj</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'kalkulator-kalorii-data';
const MONTHS = ['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
const WEEKDAYS = ['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];

const MEAL_TYPES = [
  { id: 'sniadanie', label: 'Śniadanie' },
  { id: 'obiad', label: 'Obiad' },
  { id: 'kolacja', label: 'Kolacja' },
  { id: 'inne', label: 'Inne' },
];

function guessMeal() {
  const h = new Date().getHours();
  if (h >= 5 && h < 11) return 'sniadanie';
  if (h >= 11 && h < 16) return 'obiad';
  if (h >= 16 && h < 22) return 'kolacja';
  return 'inne';
}

const state = {
  data: JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'),
  currentDate: null,
  calMonth: new Date().getMonth(),
  calYear: new Date().getFullYear(),
  selectedProduct: null,
  selectedMeal: 'inne',
};

const $ = (id) => document.getElementById(id);
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const fmtNum = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }
function getDay(date) {
  if (!state.data[date]) state.data[date] = [];
  return state.data[date];
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function dateKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function dayTotals(items) {
  return items.reduce((a, it) => ({
    kcal: a.kcal + it.kcal,
    protein: a.protein + it.protein,
    carbs: a.carbs + it.carbs,
    fat: a.fat + it.fat,
    fiber: a.fiber + it.fiber,
  }), { kcal:0, protein:0, carbs:0, fat:0, fiber:0 });
}

function showView(name) {
  ['viewCalendar','viewDay'].forEach(v => $(v).classList.add('hidden'));
  $('view' + name).classList.remove('hidden');
  $('view' + name).scrollTop = 0;
}

// === KALENDARZ ===
function renderCalendar() {
  const y = state.calYear, m = state.calMonth;
  $('calMonth').textContent = MONTHS[m];
  $('calYear').textContent = y;
  $('avgLabel').textContent = `Średnia w ${MONTHS[m]}`;

  const first = new Date(y, m, 1);
  const last = new Date(y, m+1, 0).getDate();
  let startDay = first.getDay() - 1;
  if (startDay < 0) startDay = 6;
  const prevLast = new Date(y, m, 0).getDate();
  const today = todayStr();

  const cells = [];
  for (let i = startDay - 1; i >= 0; i--) {
    cells.push({ d: prevLast - i, other: true, y: m === 0 ? y-1 : y, m: m === 0 ? 11 : m-1 });
  }
  for (let d = 1; d <= last; d++) {
    cells.push({ d, other: false, y, m });
  }
  while (cells.length % 7 !== 0) {
    const nextD = cells.length - last - startDay + 1;
    cells.push({ d: nextD, other: true, y: m === 11 ? y+1 : y, m: m === 11 ? 0 : m+1 });
  }

  // Średnia kcal w tym miesiącu
  let sumKcal = 0, daysWith = 0;
  for (let d = 1; d <= last; d++) {
    const items = state.data[dateKey(y, m, d)];
    if (items && items.length) {
      sumKcal += dayTotals(items).kcal;
      daysWith++;
    }
  }
  $('avgVal').textContent = daysWith ? fmtNum(Math.round(sumKcal / daysWith)) : '—';

  $('calGrid').innerHTML = cells.map(c => {
    const key = dateKey(c.y, c.m, c.d);
    const items = state.data[key];
    const kcal = items && items.length ? Math.round(dayTotals(items).kcal) : 0;
    const cls = [
      'cal-cell',
      c.other ? 'other' : '',
      (!c.other && kcal > 0) ? 'data' : '',
      (!c.other && key === today) ? 'today' : '',
    ].filter(Boolean).join(' ');
    return `<button class="${cls}" data-key="${key}" data-other="${c.other}">
      <span class="d">${c.d}</span>
      ${kcal > 0 && !c.other ? `<span class="k">${fmtNum(kcal)}</span>` : ''}
    </button>`;
  }).join('');

  $('calGrid').querySelectorAll('.cal-cell').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.other === 'true') {
        const [y, m] = btn.dataset.key.split('-').map(Number);
        state.calYear = y; state.calMonth = m - 1;
        renderCalendar();
      } else {
        openDay(btn.dataset.key);
      }
    });
  });
}

// === DZIEŃ ===
function openDay(date) {
  state.currentDate = date;
  const [y, m, d] = date.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const today = todayStr();
  $('dayTitle').textContent = date === today ? 'Dzisiaj' : `${d} ${MONTHS[m-1]}`;
  $('daySub').textContent = `${d} ${MONTHS[m-1]} ${y}`;

  $('searchInput').value = '';
  $('searchClear').classList.remove('show');
  $('searchHint').classList.remove('show');
  $('results').innerHTML = '';

  renderDay();
  showView('Day');
}

function renderDay() {
  const items = getDay(state.currentDate);
  const t = dayTotals(items);
  $('totalCal').textContent = fmtNum(Math.round(t.kcal));
  // macro tiles
  $('mP').textContent = t.protein.toFixed(0);
  $('mC').textContent = t.carbs.toFixed(0);
  $('mF').textContent = t.fat.toFixed(0);
  $('mFi').textContent = t.fiber.toFixed(0);
  // legend
  $('legP').textContent = `${t.protein.toFixed(0)} g`;
  $('legC').textContent = `${t.carbs.toFixed(0)} g`;
  $('legF').textContent = `${t.fat.toFixed(0)} g`;
  // bar segments (proportional to kcal contribution: B*4, W*4, T*9)
  const segP = t.protein * 4, segC = t.carbs * 4, segF = t.fat * 9;
  const sum = segP + segC + segF;
  if (sum > 0) {
    $('barP').style.width = (segP / sum * 100) + '%';
    $('barC').style.width = (segC / sum * 100) + '%';
    $('barF').style.width = (segF / sum * 100) + '%';
  } else {
    $('barP').style.width = '0%';
    $('barC').style.width = '0%';
    $('barF').style.width = '0%';
  }

  // grupowanie po meal
  const groups = {};
  MEAL_TYPES.forEach(mt => groups[mt.id] = []);
  items.forEach((it, idx) => {
    const m = it.meal && groups[it.meal] ? it.meal : 'inne';
    groups[m].push({ ...it, _idx: idx });
  });

  $('mealsWrap').innerHTML = MEAL_TYPES.map(mt => {
    const list = groups[mt.id];
    const kcal = list.reduce((s, it) => s + it.kcal, 0);
    const body = list.length
      ? list.map(it => `
          <div class="meal-item">
            <div class="mi-info">
              <div class="mi-name">${escapeHtml(it.name)}</div>
              <div class="mi-meta">${it.grams} g</div>
            </div>
            <span class="mi-kcal">${Math.round(it.kcal)}</span>
            <button class="mi-rm" data-rm="${it._idx}" aria-label="Usuń">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>`).join('')
      : `<div class="empty-meal">Brak produktów</div>`;
    return `
      <div class="meal-group">
        <div class="meal-head">
          <div class="mh-l">
            <span class="mh-dot"></span>
            <span class="mh-name">${mt.label}</span>
          </div>
          <span class="mh-kcal">${fmtNum(Math.round(kcal))} kcal</span>
        </div>
        <div class="meal-card">${body}</div>
      </div>
    `;
  }).join('');

  $('mealsWrap').querySelectorAll('button[data-rm]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      items.splice(+btn.dataset.rm, 1);
      save();
      renderDay();
    });
  });
}

// === WYSZUKIWANIE ===
let searchTimer;
async function searchProducts(query) {
  $('searchHint').classList.add('show');
  $('searchHint').textContent = 'Wyszukiwanie...';
  $('results').innerHTML = '<div class="loader"><div class="spinner"></div>Szukam...</div>';
  try {
    const url = `https://pl.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=20&fields=code,product_name,product_name_pl,brands,nutriments`;
    const res = await fetch(url);
    const json = await res.json();
    renderResults(json.products || []);
  } catch (e) {
    $('results').innerHTML = '<div class="empty-meal">Błąd. Sprawdź połączenie.</div>';
    $('searchHint').classList.remove('show');
  }
}

function renderResults(products) {
  const valid = products.filter(p => {
    const n = p.nutriments || {};
    const name = p.product_name_pl || p.product_name;
    return name && (n['energy-kcal_100g'] || n.energy_100g);
  });
  if (!valid.length) {
    $('searchHint').classList.remove('show');
    $('results').innerHTML = '<div class="empty-meal">Brak wyników</div>';
    return;
  }
  $('searchHint').textContent = `Podpowiedzi · ${valid.length} ${valid.length === 1 ? 'wynik' : 'wyniki'}`;
  $('results').innerHTML = valid.map((p, i) => {
    const name = p.product_name_pl || p.product_name;
    const brand = p.brands ? p.brands.split(',')[0] : '';
    const n = p.nutriments || {};
    const kcal = Math.round(n['energy-kcal_100g'] || (n.energy_100g ? n.energy_100g / 4.184 : 0));
    return `
      <div class="prod-card" data-idx="${i}">
        <div class="pc-info">
          <div class="pc-name">${escapeHtml(name)}</div>
          <div class="pc-meta">${kcal} kcal / 100 g${brand ? ' · ' + escapeHtml(brand) : ''}</div>
        </div>
        <span class="pc-add">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </span>
      </div>
    `;
  }).join('');
  $('results').querySelectorAll('.prod-card').forEach(card => {
    card.addEventListener('click', () => openSheet(valid[+card.dataset.idx]));
  });
}

// === SHEET MODAL ===
function nutrientsFor(product, grams) {
  const n = product.nutriments || {};
  const f = grams / 100;
  const kcalPer100 = n['energy-kcal_100g'] || (n.energy_100g ? n.energy_100g / 4.184 : 0);
  return {
    kcal: kcalPer100 * f,
    protein: (n.proteins_100g || 0) * f,
    carbs: (n.carbohydrates_100g || 0) * f,
    fat: (n.fat_100g || 0) * f,
    fiber: (n.fiber_100g || 0) * f,
  };
}

function openSheet(product) {
  state.selectedProduct = product;
  state.selectedMeal = guessMeal();
  const name = product.product_name_pl || product.product_name;
  const n = product.nutriments || {};
  const kcalPer100 = Math.round(n['energy-kcal_100g'] || (n.energy_100g ? n.energy_100g / 4.184 : 0));
  $('sheetTitle').textContent = name;
  $('sheetSub').textContent = `${kcalPer100} kcal / 100 g`;
  $('gramsInput').value = 100;
  setActiveQuick(100);
  setActiveMeal(state.selectedMeal);
  updatePreview();
  $('sheetDim').classList.add('show');
  requestAnimationFrame(() => $('sheet').classList.add('show'));
}

function setActiveMeal(meal) {
  document.querySelectorAll('#mealPicker button').forEach(b => {
    b.classList.toggle('on', b.dataset.meal === meal);
  });
}

function closeSheet() {
  $('sheet').classList.remove('show');
  setTimeout(() => $('sheetDim').classList.remove('show'), 250);
  state.selectedProduct = null;
}

function setActiveQuick(val) {
  document.querySelectorAll('.quick button').forEach(b => {
    b.classList.toggle('on', +b.dataset.amt === val);
  });
}

function updatePreview() {
  const grams = +$('gramsInput').value || 0;
  const n = nutrientsFor(state.selectedProduct, grams);
  $('prevKcal').textContent = Math.round(n.kcal);
  $('prevMacros').textContent = `Białko ${n.protein.toFixed(1)} g · Węgle ${n.carbs.toFixed(1)} g · Tłuszcze ${n.fat.toFixed(1)} g`;
}

function addToDay() {
  const grams = +$('gramsInput').value;
  if (!grams || grams <= 0) return;
  const p = state.selectedProduct;
  const n = nutrientsFor(p, grams);
  getDay(state.currentDate).push({
    name: p.product_name_pl || p.product_name,
    grams,
    meal: state.selectedMeal,
    ...n,
  });
  save();
  closeSheet();
  // wyczyść wyszukiwanie
  $('searchInput').value = '';
  $('searchClear').classList.remove('show');
  $('searchHint').classList.remove('show');
  $('results').innerHTML = '';
  renderDay();
}

// === EVENTY ===
$('prevMonth').addEventListener('click', () => {
  state.calMonth--;
  if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
  renderCalendar();
});
$('nextMonth').addEventListener('click', () => {
  state.calMonth++;
  if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
  renderCalendar();
});
$('backToCal').addEventListener('click', () => {
  renderCalendar();
  showView('Calendar');
});
$('clearDayBtn').addEventListener('click', () => {
  if (confirm('Wyczyścić wszystkie produkty z tego dnia?')) {
    state.data[state.currentDate] = [];
    save();
    renderDay();
  }
});

$('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  $('searchClear').classList.toggle('show', q.length > 0);
  if (q.length < 2) {
    $('results').innerHTML = '';
    $('searchHint').classList.remove('show');
    return;
  }
  searchTimer = setTimeout(() => searchProducts(q), 400);
});
$('searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    if (q) searchProducts(q);
  }
});
$('searchClear').addEventListener('click', () => {
  $('searchInput').value = '';
  $('searchClear').classList.remove('show');
  $('searchHint').classList.remove('show');
  $('results').innerHTML = '';
  $('searchInput').focus();
});

$('confirmBtn').addEventListener('click', addToDay);
$('cancelBtn').addEventListener('click', closeSheet);
$('sheetDim').addEventListener('click', closeSheet);
$('gramsInput').addEventListener('input', () => {
  setActiveQuick(+$('gramsInput').value);
  updatePreview();
});
document.querySelectorAll('.quick button').forEach(btn => {
  btn.addEventListener('click', () => {
    const v = +btn.dataset.amt;
    $('gramsInput').value = v;
    setActiveQuick(v);
    updatePreview();
  });
});
document.querySelectorAll('#mealPicker button').forEach(btn => {
  btn.addEventListener('click', () => {
    state.selectedMeal = btn.dataset.meal;
    setActiveMeal(state.selectedMeal);
  });
});

// === INIT ===
renderCalendar();
showView('Calendar');
</script>
</body>
</html>
